# examples/config/main_all_sinks.yaml

monitaudit:
  application: main_all_sinks

  global:
    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: examples/output/json_sink/main_all_sinks.jsonl

      file_sink:
        enabled: true
        format: csv
        delimiter: ";"
        path: examples/output/file_sink/main_all_sinks

      delta_sink:
        enabled: false

  environments:
    dev: {}

    acc: {}

    prod: {}
    