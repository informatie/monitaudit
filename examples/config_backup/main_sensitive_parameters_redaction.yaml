monitaudit:
  application: monitaudit-example-redaction
  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: examples/output/redaction.jsonl
      file_sink:
        enabled: true
        path: examples/output/redaction.log
      delta_sink:
        enabled: false
        table: main.logging.monitaudit_redaction
  environments:
    dev:
      is_databricks: false
      logging:
        level: DEBUG
        timer: true
        parameters: true
        max_parameter_length: 1000
        sink_failure_mode: continue
      sinks:
        console_sink:
          enabled: true
        json_sink:
          enabled: true
          path: examples/output/redaction.jsonl
        file_sink:
          enabled: true
          path: examples/output/redaction.log
        delta_sink:
          enabled: false
    acc:
      is_databricks: false
    prod:
      is_databricks: false
