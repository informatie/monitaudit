monitaudit:
  application: monitaudit-example-basic
  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
        parameters:
        - ws_nummer
        - ws_naam
        - workspace_count
        - processed_elements
        - reason
      json_sink:
        enabled: true
        path: examples/output/main_basic.jsonl
      file_sink:
        enabled: true
        path: examples/output/main_basic.log
      delta_sink:
        enabled: false
        table: main.logging.monitaudit_basic
  environments:
    dev:
      is_databricks: false
      logging:
        level: DEBUG
      sinks:
        console_sink:
          enabled: true
          parameters:
          - ws_nummer
          - ws_naam
          - workspace_count
          - processed_elements
          - reason
        json_sink:
          enabled: true
          path: examples/output/main_basic.jsonl
        file_sink:
          enabled: true
          path: examples/output/main_basic.log
        delta_sink:
          enabled: false
    acc:
      is_databricks: false
    prod:
      is_databricks: false
