monitaudit:
  application: monitaudit-example-json-sink
  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: examples/output/main_json_sink.jsonl
      file_sink:
        enabled: true
        path: examples/output/main_json_sink.log
      delta_sink:
        enabled: false
        table: main.logging.json_sink
  environments:
    dev:
      is_databricks: false
    acc:
      is_databricks: false
    prod:
      is_databricks: false
