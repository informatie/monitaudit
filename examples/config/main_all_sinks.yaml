# examples/config/main_all_sinks.yaml

monitaudit:
  application: monitaudit-example-all-sinks

  global:
    logging:
      level: DEBUG

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: examples/output/json_sink/main_all_sinks.jsonl

      file_sink:
        enabled: true
        format: text
        path: examples/output/file_sink/main_all_sinks.log

      delta_sink:
        enabled: false
        table: main.logging.monitaudit_all_sinks

  environments:
    dev: {}
    acc: {}
    prod: {}