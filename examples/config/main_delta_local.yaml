monitaudit:
  application: monitaudit-example-delta-local
  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: examples/output/main_delta_local.jsonl
      file_sink:
        enabled: true
        path: examples/output/main_delta_local.log
      delta_sink:
        enabled: true
        table: main.logging.delta_local
  environments:
    dev: {}
    acc: {}
    prod: {}
