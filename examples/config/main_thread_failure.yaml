monitaudit:
  application: monitaudit-example-thread-failure
  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: examples/output/main_thread_failure.jsonl
      file_sink:
        enabled: true
        path: examples/output/main_thread_failure.log
      delta_sink:
        enabled: false
        table: main.logging.thread_failure
  environments:
    dev: {}
    acc: {}
    prod: {}
