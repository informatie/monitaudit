[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitaudit"
dynamic = ["version"]
description = "A lightweight, low-overhead Python framework for real-time log monitoring and structured system auditing."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["logging", "monitoring", "audit-trail", "telemetry", "observability"]
authors = [
    { name = "Informatie", email = "informatie@nednazit.nl" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]
dependencies = [
    "delta-spark>=4.4.1",
    "prek>=0.5.7",
    "py4j>=0.10.9.9",
    "pydantic>=2.0",
    "pyspark[sql]>=4.2.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
monitaudit = "monitaudit.main:run"

[project.urls]
Homepage = "https://github.com/informatie/monitaudit"
Issues = "https://github.com/informatie/monitaudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/monitaudit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.version]
source = "regex"
path = "src/monitaudit/__init__.py"