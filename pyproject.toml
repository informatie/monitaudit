[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"


[project]
name = "monitaudit"
dynamic = ["version"]

description = "A lightweight, low-overhead Python framework for real-time log monitoring and structured system auditing."

readme = "README.md"

requires-python = ">=3.12"

license = "MIT"

keywords = [
    "logging",
    "monitoring",
    "audit-trail",
    "telemetry",
    "observability",
]

authors = [
    { name = "Informatie", email = "informatie@nednazit.nl" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "py4j>=0.10.9.9",
    "delta-spark>=4.4.1",
    "pyspark[sql]>=4.2.0",
    "types-pyyaml>=6.0.12.20261030",
]

[project.scripts]
monitaudit = "monitaudit.main:run"


[project.urls]
Homepage = "https://github.com/informatie/monitaudit"
Issues = "https://github.com/informatie/monitaudit/issues"


[dependency-groups]
dev = [
    "mypy",
    "prek>=0.5.7",
    "pyright",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/monitaudit",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/RELEASE.md",    
    "/LICENSE",
]

[tool.hatch.version]
source = "regex"
path = "src/monitaudit/__init__.py"


[tool.mypy]
python_version = "3.14"

strict = true

warn_unused_configs = true
show_error_codes = true
pretty = true

plugins = [
    "pydantic.mypy",
]


[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

include = [
    "src",
    "tests",
]

exclude = [
    ".venv",
    "build",
    "dist",
]

reportMissingTypeStubs = false

reportUnknownArgumentType = true
reportUnknownMemberType = true
reportUnknownVariableType = true


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

[tool.ruff.lint]
ignore = [
    "BLE001",
]