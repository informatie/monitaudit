monitaudit:
  application: myappl

  global:
    logging:
      level: INFO
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
      
    sinks:
      console_sink:
        enabled: true
        parameters:
          - ws_nummer
          - element_code
          - element_name 

      json_sink:
        enabled: true
        path: var/log/monitaudit/json_sink/monitaudit.jsonl

      delta_sink:
        enabled: false

      file_sink:
        enabled: true
        format: csv
        delimiter: ;
        path: var/log/monitaudit/file_sink/monitaudit

  dev:
    is_databricks: false

    sinks:
      console_sink:
        enabled: true

      delta_sink:
        table: dev.monitaudit.monitaudit_logs
  
  acc:
    is_databricks: true

    logging:
      level: INFO

    sinks:
      console_sink:
        enabled: false

      delta_sink:
        table: acc.monitaudit.monitaudit_logs


  prod:
    is_databricks: true

    logging:
      level: WARNING

    sinks:
      console_sink:
        enabled: false

      json_sink:
        path: /var/log/monitaudit

      delta_sink:
        enabled: true
        table: prod.monitaudit.monitaudit_logs
  