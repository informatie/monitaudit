# monitaudit.properties
# MonitAudit library defaults.
# Applications should normally override these settings through
# monitaudit.runtime.

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
logging.level=INFO
logging.timer=true
logging.parameters=true
logging.max_parameter_length=1000
logging.sink_failure_mode=continue
# number of days
logging.file_cycle=10
# ---------------------------------------------------------------------------
# CONSOLE SINK, settings are in monitaudit.runtime
# ---------------------------------------------------------------------------
sinks.console_sink.enabled=false

# ---------------------------------------------------------------------------
# JSON SINK,  settings are in monitaudit.runtime
# ---------------------------------------------------------------------------
sinks.json_sink.enabled=false

# ---------------------------------------------------------------------------
# FILE SINK,  settings are in monitaudit.runtime
# ---------------------------------------------------------------------------
sinks.file_sink.enabled=false

# ---------------------------------------------------------------------------
# DELTA SINK,  settings are in monitaudit.runtime
# ---------------------------------------------------------------------------
sinks.delta_sink.enabled=false